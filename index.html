<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#203047" />
    <meta name="description" content="One ball. One thumb. Aim, cause a chain reaction, catch the ball." />
    <!-- Add to Home Screen: full screen, portrait, no browser chrome. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ricochet" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <title>Pocket Ricochet</title>
    <style>
      :root {
        --ink: #203047;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --ink: #203047;
        }
      }
      :root[data-theme='dark'] {
        --ink: #203047;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--ink);
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      body {
        position: fixed;
        inset: 0;
      }
      /* Fill the visible viewport inside the notch/home-indicator safe areas and keep the cabinet
         anchored to the bottom, so the control strip is always within thumb reach. */
      #game {
        position: fixed;
        top: env(safe-area-inset-top, 0px);
        right: env(safe-area-inset-right, 0px);
        bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px);
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      canvas {
        display: block;
        touch-action: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      // iOS Safari ignores user-scalable=no for pinch and double-tap; block those gestures.
      for (const type of ['gesturestart', 'gesturechange', 'gestureend', 'dblclick', 'contextmenu']) {
        document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
      }
      document.addEventListener('touchmove', (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
